name: release

# Flutter 3.50.1 (Dart 3.14.0). F-Droid extracts this pin during prebuild.
# flutter-version: 'ae9b586f34a8443573f82ef57c3bf914a908cbf7'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" {print $2}' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]
          changelog="fastlane/metadata/android/en-US/changelogs/${version#*+}.txt"
          test -s "$changelog"
          test "$(wc -c < "$changelog")" -le 500
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v${version%+*}"
          fi
          echo "RELEASE_VERSION_NAME=${version%+*}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${version#*+}" >> "$GITHUB_ENV"
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          revision=$(awk '/^# flutter-version/ {print substr($3, 2, 40)}' .github/workflows/release.yml)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          sdk_version=$(awk '/^# Flutter / {print $3}' .github/workflows/release.yml)
          [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sdk="$RUNNER_TEMP/flutter"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/flutter/flutter.git "refs/tags/$sdk_version:refs/tags/$sdk_version"
          git -C "$sdk" checkout --detach "$revision"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$revision"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Resolve locked packages and build USB ID database
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          python3 tools/build_usbids_db.py
      - name: Analyze and test
        run: |
          # Existing lint warnings remain visible; analyzer errors fail the job.
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build using the F-Droid release command
        run: flutter build apk --release --target-platform=android-arm64
      - name: Verify ARM64 APK contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              names = set(apk.namelist())
              assert apk.read('assets/flutter_assets/assets/db/usbids.sqlite') == Path('assets/db/usbids.sqlite').read_bytes()
          abis = {name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, abis
          for library in ('libapp.so', 'libflutter.so'):
              assert f'lib/arm64-v8a/{library}' in names, library
          PY
      - name: Scan APK for F-Droid compatibility
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid"
          "$RUNNER_TEMP/fdroid/bin/pip" install fdroidserver==2.4.6 androguard==4.1.4
          "$RUNNER_TEMP/fdroid/bin/fdroid" scanner --verbose --refresh --exit-code build/app/outputs/flutter-apk/app-release.apk
          "$RUNNER_TEMP/fdroid/bin/python" - <<'PY'
          import os
          from fdroidserver.common import get_androguard_APK
          apk = get_androguard_APK('build/app/outputs/flutter-apk/app-release.apk')
          assert apk.get_package() == 'org.kaijinlab.tap_ducky'
          assert apk.get_androidversion_name() == os.environ['RELEASE_VERSION_NAME']
          assert apk.get_androidversion_code() == os.environ['RELEASE_VERSION_CODE']
          assert apk.get_attribute_value('application', 'debuggable') != 'true'
          PY
      - name: Test Android code and verify lockfile
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest --max-workers=2
          git diff --exit-code -- ../pubspec.lock
